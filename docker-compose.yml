# Environnement local uniquement.
# Render ne lance pas ce fichier. Il construit la cible "production" du Dockerfile
# et un service MySQL séparé. Voir docs/deploiement-render.md.
#
# Interpolation : docker compose --env-file .env
# Les conteneurs reçoivent aussi ce fichier via env_file.
# La section environment remplace DB_HOST pour le réseau Docker.
# Le fichier .env peut donc conserver DB_HOST=127.0.0.1 sans effet dans les conteneurs.

name: crm-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: crm-backend:dev
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
      RUN_SWAGGER_GENERATE: "true"
      L5_SWAGGER_USE_ABSOLUTE_PATH: "false"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: crm-backend:dev
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-crm_db}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql_data:
  app_storage:
